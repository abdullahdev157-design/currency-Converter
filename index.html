<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Currecy Converter</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h2>Currency Converter</h2>

      <nav>
        <ul>
          <li><a href="#about">About</a></li>
          <li><a href="#services">Services</a></li>
          <li><a href="#home">Home</a></li>
          <li><a href="#contact">Contact</a></li>
        </ul>
      </nav>
    </header>
    <main class="container">
      <h1>Currency Converter</h1>
      <form id="currency-form">
        <label for="amount">Enter Amount:</label>
        <input type="number" id="amount" required />

        <label for="from-currency">From Currency:</label>
        <input
          id="from-currency"
          list="currency-options"
          value="PKR"
          maxlength="3"
          required
        />

        <label for="to-currency">To Currency:</label>
        <input
          id="to-currency"
          list="currency-options"
          placeholder="One Currency or ALL"
          maxlength="3"
          required
        />

        <!--
          Ye datalist dono currency inputs ke saath list="currency-options"
          ke zariye connected hai. JavaScript API ki currencies yahan add karta
          hai, jabke ALL user ko tamam exchange results request karne deta hai.
        -->
        <datalist id="currency-options">
          <option value="ALL">All currencies</option>
        </datalist>

        <button id="btn" type="submit">Convert</button>
      </form>

      <!--
        JavaScript conversion results is section ke andar likhta hai.
        aria-live screen reader ko updated result ke bare mein batata hai.
      -->
      <section id="result" aria-live="polite"></section>
    </main>
    <footer>
      All Rights Reserved
      <strong> &copy; AbdullahDev157 Currency Converter.</strong>
    </footer>
    <script src="script.js"></script>
  </body>
</html>
